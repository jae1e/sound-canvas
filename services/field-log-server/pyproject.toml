[project]
name = "fls"
version = "0.1.0"
description = "Field Voice Log server: object store, event log and transcription"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "soundfile>=0.12",
  "scipy>=1.11",
]

[project.optional-dependencies]
asr = [
  "qwen-asr",
  "torch",
  "sherpa-onnx>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fls = "fls.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fls"]

[tool.pytest.ini_options]
testpaths = ["tests"]

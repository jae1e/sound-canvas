name = "vlc-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Secrets (never put values here). Set with `wrangler secret put <NAME>`:
#   KAKAO_REST_KEY, TMAP_APP_KEY, TOKEN_SIGNING_SECRET
# For local dev, copy .dev.vars.example to .dev.vars.

[vars]
RATE_LIMIT_PER_MIN = "30"
RATE_LIMIT_PER_DAY = "2000"

# Rate-limit counters. Create with `wrangler kv namespace create RATE_LIMIT`
# and paste the returned id below. Without it the Worker uses per-isolate memory counters.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

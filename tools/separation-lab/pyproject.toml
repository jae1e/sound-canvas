[project]
name = "seplab"
version = "0.1.0"
description = "Test lab for the audio-separation demo (targets plus others)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "scipy>=1.11",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Real backend. Needs Hugging Face access to the gated SAM Audio checkpoints.
sam = [
  "torch",
  "torchaudio",
  "sam-audio @ git+https://github.com/facebookresearch/sam-audio",
  "accelerate",  # lets transformers build T5 directly on the GPU (memory-light loading)
]

# Local web demo (Gradio UI + yt-dlp URL import). Installs next to the sam extra:
#   uv sync --extra sam --extra web
web = [
  "gradio>=5",
  "yt-dlp[default]",  # [default] brings yt-dlp-ejs, the YouTube challenge solver (needs node or deno)
]

# Speaker/singer clustering spike. Needs access to pyannote/speaker-diarization-community-1.
diarization = [
  "torch",
  "torchaudio",
  "pyannote.audio>=4.0",
  "pyannote.metrics",
]

[project.scripts]
seplab = "seplab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["seplab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# sam-audio pins numpy<2 (via laion-clap) and pyannote.audio 4 needs numpy>=2.2, so the extras
# cannot share an environment. Use a separate venv for diarization:
#   UV_PROJECT_ENVIRONMENT=.venv-diar uv sync --extra diarization
[tool.uv]
conflicts = [[{ extra = "sam" }, { extra = "diarization" }]]

[project]
name = "seplab"
version = "0.1.0"
description = "Test lab for the audio-separation demo (targets plus others)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "scipy>=1.11",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Real backend. Needs Hugging Face access to the gated SAM Audio checkpoints.
sam = [
  "torch",
  "torchaudio",
  "sam-audio @ git+https://github.com/facebookresearch/sam-audio",
]

[project.scripts]
seplab = "seplab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["seplab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

id: US-1.1
persona: P1
persona_name: Street-interview Shorts creator
title: Keep the interviewee
prompt_types:
- visual
strategy: sequential
clips:
  real:
  - 5 street clips, friends as interviewee, camera holder and passers-by
  synthetic:
  - 'Lav-reference: interviewee on a lav while the phone records'
  - Speech + passer-by speech at 0 and -5 dB SNR
baselines:
- CapCut noise removal
- Adobe Enhance Speech
metrics:
- si_sdri_db
- Intelligibility check by listening
- Processing time under 2 min for a 90 s clip
- blind_preference
- usable_without_apology
pass_bar:
  blind_preference_min: 0.6
  usable_without_apology_min: 0.5
  note: Wins blind preference on at least 60% of clips; at least half of clips are usable without apology.
